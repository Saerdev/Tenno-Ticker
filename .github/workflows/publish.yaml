name: Update prices & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # cron-job.org calls workflow_dispatch hourly. No GitHub Actions schedule.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tenno-ticker-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site source
        uses: actions/checkout@v6

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - name: Generate hourly Arcane details snapshot
        env:
          WFM_USER_AGENT: TennoTicker/1.0 (+https://github.com/${{ github.repository }})
        run: python3 scripts/update_prices.py --output site/data/prices.json

      - name: Generate daily Mod and Arcane closed-order price snapshots
        continue-on-error: true
        env:
          RELICS_USER_AGENT: TennoTicker/1.0 (+https://github.com/${{ github.repository }})
        run: python3 scripts/update_mods.py --output site/data/mods.json --arcane-output site/data/arcane-daily.json

      - name: Generate daily Prime set history snapshot
        continue-on-error: true
        env:
          RELICS_USER_AGENT: TennoTicker/1.0 (+https://github.com/${{ github.repository }})
        run: python3 scripts/update_prime_sets.py --output site/data/prime-sets.json

      - name: Upload static website
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publish public site
        id: deployment
        uses: actions/deploy-pages@v5
